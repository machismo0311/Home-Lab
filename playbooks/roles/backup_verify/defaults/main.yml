---
# ============================================================================
# backup_verify role defaults. Runs on the storage host (Randy). Each check
# appends a {name, status, detail, ...} entry to backup_verify_results;
# report.yml assembles them into one JSON file whose `generated` timestamp
# doubles as the freshness/last_run guard (a stale file = a dead timer).
# ============================================================================

# --- pbs tag: backup freshness (PBS REST API) -------------------------------
backup_verify_pbs_scheme: https
backup_verify_pbs_host: 127.0.0.1              # query PBS locally on Randy
backup_verify_pbs_port: 8007
backup_verify_pbs_validate_certs: false        # localhost self-signed cert
backup_verify_pbs_token_id: "{{ vault_pbs_token_id | default('') }}"
backup_verify_pbs_token_secret: "{{ vault_pbs_token_secret | default('') }}"
backup_verify_pbs_datastores: []               # [] = auto-discover all
backup_verify_pbs_max_age_hours: 25            # 24h cadence + 1h slack

# Per-guest coverage: every vmid listed here must have a snapshot within
# max_age_hours somewhere across the PBS datastores. This catches a single
# guest whose backup job broke or was never created, which the per-datastore
# freshness check above cannot see (other guests keep the datastore "fresh").
# [] = skip the per-guest check (backward compatible).
backup_verify_pbs_expected_guests: [100, 101, 102, 103, 104, 105, 106, 107, 108, 201, 202, 203]

# --- zfs tag: pool health ---------------------------------------------------
backup_verify_zfs_pools: []                    # [] = every pool on the host
                                               # (covers datastore AND bulk)

# --- drive_health tag: drive health (smartctl on the storage host) ----------
# Replaced the Scrutiny API on 2026-09-04. That deployment never completed: its collectors last
# wrote on 2026-07-25 and its web tier sits on CT 103, which is unreachable for hours each day while
# it is itself backed up. The endpoint still answers 200 with those stale records, so the old check
# could have PASSED on six-week-old device state - a worse failure than an outage, because a passing
# check is one nobody revisits. SMART is now read on the host that owns the disks.
backup_verify_drive_health_timeout: 20         # seconds per smartctl invocation

# --- ds4246 tag: shelf enumeration ------------------------------------------
# Confirms the expected number of DS4246 disks enumerate to Randy (catches an
# HBA/passthrough fault even while the pool still reads ONLINE). The shelf is
# dual-pathed, so each physical disk shows as two `disk` paths — we dedup by
# WWN to count physical disks. Best-effort: whole disks in the ~4 TB band.
# 2026-07-17: 3rd vdev added (6x 4TB, 6-wide raidz2) -> 16 + 6 = 22. The shelf
# now runs 3 vdevs (8+8+6). Bump this whenever drives are added, or this check
# fails and BackupVerifyFailing fires on a healthy shelf.
backup_verify_ds4246_expected: 22
# The shelf's capacity band, declared ONCE and consumed by both the enumeration count and the
# drive-health reader. Two copies of this rule would be two disk inventories free to disagree, and
# the whole point of the expected count is that it is a single authoritative denominator.
backup_verify_disk_min_bytes: 3500000000000
backup_verify_disk_max_bytes: 4600000000000
# `timeout` guards against a wedged 9207-8e / DS4246 passthrough hanging lsblk
# indefinitely (a hang would stall the whole play into staleness — the worst
# failure mode, since it masks a dead job). If lsblk is killed the pipe yields
# 0 disks, so the check degrades to a recorded fail (found != expected) instead
# of hanging. Only lsblk needs the guard; the awk/sort/wc stages cannot block.
backup_verify_ds4246_timeout: 30               # seconds
# Every continuation line sits at the SAME indentation as the first: a folded scalar keeps the
# newline on any line indented further, which would split the awk program in half and yield 0 disks.
backup_verify_ds4246_count_cmd: >-
  timeout {{ backup_verify_ds4246_timeout }} lsblk -dnb -o TYPE,SIZE,WWN |
  awk '$1=="disk" && $2 > {{ backup_verify_disk_min_bytes }} && $2 < {{ backup_verify_disk_max_bytes }} {print $3}' |
  sort -u | wc -l

# --- report tag -------------------------------------------------------------
backup_verify_report_path: /var/log/netframe-monitor/backup-report.json
# node_exporter textfile metric for Prometheus/Grafana staleness alerting.
# Written only where the textfile dir already exists (i.e. Randy).
backup_verify_textfile_dir: /var/lib/prometheus/node-exporter
backup_verify_textfile_name: backup_verify.prom

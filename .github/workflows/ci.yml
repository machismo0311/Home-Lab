name: CI

# Lint/syntax checks for the Python services (llm_router, jarvis-oncall) and bash scripts.
# CI only — deployment to physical infra stays manual (SSH/systemd), per infra-safety policy.

# Deliberately NOT path-filtered. Both job names below ("Python lint + syntax" and
# "ShellCheck (bash)") are required status checks in main's branch protection, and a
# required check that never runs stays pending forever — a docs/vault-only PR was
# therefore unmergeable except via admin bypass. Running these on every PR costs a few
# seconds against an unchanged scripts/ and keeps the merge gate honest.
# diagram.yml and netlab.yml stay path-filtered: they are expensive and not required checks.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.15.21
      - name: Ruff lint
        run: ruff check scripts/
      - name: Syntax check (py_compile)
        run: find scripts -name '*.py' -print0 | xargs -0 python -m py_compile

      # The scheduling wrappers are executed by systemd on Ares, unattended, and one of them now
      # decides whether the estate's signed runtimes are trustworthy. Linted and tested here for
      # the same reason scripts/ is: nobody is watching at 06:30.
      - name: Ruff lint (scheduling)
        run: ruff check playbooks/scheduling/

      - name: Ruff lint (recovery)
        run: ruff check playbooks/recovery/

      # Role-shipped readers run unattended on the storage host and decide whether a backup
      # verification passes. Same reason as the two above: nobody is watching at 06:03.
      - name: Ruff lint (roles)
        run: ruff check playbooks/roles/

      - name: Syntax check (role readers)
        run: find playbooks/roles -name '*.py' -print0 | xargs -0 -r python -m py_compile

      # Every scheduling test, not a named list: a suite that has to be registered by hand is a
      # suite that eventually stops running when someone adds a file and forgets the second edit.
      - name: Scheduling wrapper tests
        run: |
          set -e
          for t in playbooks/scheduling/tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

      # Recovery drills create and destroy real guests when an operator runs them, so their guards
      # are tested here against stubs on every push.
      - name: Recovery drill tests
        run: |
          set -e
          for t in playbooks/recovery/tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

  shellcheck:
    name: ShellCheck (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (error severity blocks)
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
          find playbooks/scheduling -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
          find playbooks/recovery -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
